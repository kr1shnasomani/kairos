# Dependabot version updates for KAIROS — one entry per ecosystem/manifest location.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # --- Python (backend API + workers) ---
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]

  # --- npm (Next.js frontend) ---
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]

  # --- Go modules (OT connector) ---
  - package-ecosystem: "gomod"
    directory: "/backend/connectors"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      go:
        patterns: ["*"]

  # --- Docker base images (one per Dockerfile) ---
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
      - "/backend/connectors"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns: ["*"]

  # --- GitHub Actions (all workflows) ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
