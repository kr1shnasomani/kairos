name: Tests

# Least-privilege default for all jobs — read-only access to repo contents.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '!backend/connectors/**'
      - 'tests/**'
      - 'db/**'
      - 'fixtures/**'
      - 'docker-compose.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '!backend/connectors/**'
      - 'tests/**'
      - 'db/**'
      - 'fixtures/**'
      - 'docker-compose.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Build .env: start from example (all local-service defaults are pre-filled)
      # then append the secrets that require real cloud credentials
      - name: Create .env
        run: |
          cp .env.example .env
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"              >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"    >> .env
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env
          echo "SUPABASE_JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET }}" >> .env
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}"              >> .env
          echo "NVIDIA_NIM_API_KEY=${{ secrets.NVIDIA_NIM_API_KEY }}"  >> .env
          echo "JINA_API_KEY=${{ secrets.JINA_API_KEY }}"              >> .env

      - name: Start services
        run: docker compose up -d --build

      # Poll /health until the API is accepting requests (up to 5 minutes)
      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "API ready (${i}x10s)"
              exit 0
            fi
            sleep 10
          done
          echo "API did not become healthy — dumping logs"
          docker compose logs kairos-backend-api
          exit 1

      - name: Initialise databases
        run: make init-all

      - name: Seed test users
        run: docker compose exec -T kairos-backend-api python scripts/seed_users.py

      - name: Run test suite
        run: docker compose exec -T kairos-backend-api python -m pytest tests/ -q --timeout=120

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=150

      - name: Tear down
        if: always()
        run: docker compose down -v
