name: Neo4j Aura keep-alive

# Aura Free pauses a database after 3 days idle. This runs a trivial `RETURN 1`
# against the Aura HTTPS Query API on a schedule, resetting the idle timer.
# It talks to Aura directly — no backend/host required.

on:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC — comfortably inside the 3-day pause window
  workflow_dispatch: {}    # manual "Run workflow" button in the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: RETURN 1 against Aura (resets the idle timer)
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          set -euo pipefail
          HOST=$(printf '%s' "$NEO4J_URI" | sed -E 's#^[a-zA-Z0-9+]+://##; s#[:/].*$##')
          DB="${NEO4J_DATABASE:-neo4j}"
          CODE=$(curl -s -m 60 -o /tmp/ka.json -w '%{http_code}' \
            -u "$NEO4J_USERNAME:$NEO4J_PASSWORD" \
            -H 'Content-Type: application/json' -H 'Accept: application/json' \
            "https://$HOST/db/$DB/query/v2" \
            -d '{"statement":"RETURN 1 AS keepalive"}')
          echo "HTTP $CODE"; cat /tmp/ka.json || true; echo
          [ "$CODE" = "200" ] || [ "$CODE" = "202" ]
