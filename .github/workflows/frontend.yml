name: Frontend CI

# Least-privilege default for all jobs — read-only access to repo contents.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

defaults:
  run:
    working-directory: frontend

jobs:
  ci:
    # One job, one `npm ci` — typecheck → lint → build → audit run as sequential steps.
    # Fail-fast: the first failing step stops the run (fewer wasted minutes than 4 parallel jobs).
    name: Typecheck · Lint · Build · Audit
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"   # stub so next build resolves config
      NEXT_PUBLIC_KAIROS_PHASE: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Audit (high + critical only)
        run: npm audit --audit-level=high
