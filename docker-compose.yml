name: kairos
version: "3.9"

# =============================================================================
# KAIROS — Local Development Stack
# Start: docker compose up -d
# Stop:  docker compose down
# Nuke:  docker compose down -v  (destroys all volumes)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Layer 4: Temporal Reality Graph — Neo4j (local)
  # Browser UI: http://localhost:7474
  # Bolt:       bolt://localhost:7687
  # ---------------------------------------------------------------------------
  kairos-neo4j:
    image: neo4j:5.20-community
    container_name: kairos-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-kairos_dev_password}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "1G"
  # ---------------------------------------------------------------------------
  # Layer 12: Frontend — Next.js
  # ---------------------------------------------------------------------------
  kairos-frontend:
    image: node:20-alpine
    container_name: kairos-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    command: ["sh", "-c", "echo 'Frontend placeholder' && tail -f /dev/null"]
    volumes:
      - kairos-neo4j_data:/data
      - kairos-neo4j_logs:/logs
      - kairos-neo4j_plugins:/plugins
      - ./backend/db/kairos-neo4j:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://localhost:7474/db/neo4j/cluster/available"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Layer 11: Vector Search — Qdrant
  # REST:  http://localhost:6333
  # gRPC:  localhost:6334
  # UI:    http://localhost:6333/dashboard
  # ---------------------------------------------------------------------------
  kairos-qdrant:
    image: qdrant/qdrant:v1.9.4
    container_name: kairos-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - kairos-qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 20s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Layer 11: Exact Search — Elasticsearch
  # REST: http://localhost:9200
  # ---------------------------------------------------------------------------
  kairos-elasticsearch:
    image: elasticsearch:8.13.4
    container_name: kairos-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx1g"
    volumes:
      - kairos-elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Cache + Event Bus — Redis (Streams + Cache)
  # Port: 6379
  # ---------------------------------------------------------------------------
  kairos-redis:
    image: redis:7.2-alpine
    container_name: kairos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - kairos-redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Durable Workflow Engine — Temporal.io
  # Backend DB (Temporal internal): postgresql
  # Temporal gRPC: localhost:7233
  # Temporal Web UI: http://localhost:8088
  # ---------------------------------------------------------------------------
  kairos-temporal-postgres:
    image: postgres:14-alpine
    container_name: kairos-temporal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - kairos-temporal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5

  kairos-temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: kairos-temporal
    restart: unless-stopped
    ports:
      - "7233:7233"
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: kairos-temporal-postgres
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig.yaml
    depends_on:
      kairos-temporal-postgres:
        condition: service_healthy
    volumes:
      - ./backend/temporal/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig.yaml
    healthcheck:
      test: ["CMD", "temporal", "workflow", "list", "--namespace", "default"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  kairos-temporal-ui:
    image: temporalio/ui:2.26.2
    container_name: kairos-temporal_ui
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      TEMPORAL_ADDRESS: kairos-temporal:7233
      TEMPORAL_CORS_ORIGINS: "http://localhost:3000"
    depends_on:
      - kairos-temporal

  # ---------------------------------------------------------------------------
  # Governance — Open Policy Agent (OPA)
  # REST: http://kairos-opa:8181
  # ---------------------------------------------------------------------------
  kairos-opa:
    image: openpolicyagent/opa:0.65.0
    container_name: kairos-opa
    restart: unless-stopped
    ports:
      - "8181:8181"
    command:
      - "run"
      - "--server"
      - "--log-format=json"
      - "--log-level=info"
      - "/policies"
    volumes:
      - ./backend/policies:/policies
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://kairos-opa:8181/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Secrets + Signing — HashiCorp Vault (dev mode)
  # UI: http://localhost:8200
  # Root Token: kairos-dev-root-token (dev mode only)
  # ---------------------------------------------------------------------------
  kairos-vault:
    image: hashicorp/vault:1.17
    container_name: kairos-vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "${VAULT_DEV_ROOT_TOKEN:-kairos-dev-root-token}"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Observability — OpenTelemetry Collector
  # OTLP gRPC: 4317
  # OTLP HTTP: 4318
  # ---------------------------------------------------------------------------
  kairos-otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.0
    container_name: kairos-otel-collector
    restart: unless-stopped
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus metrics exporter
    volumes:
      - ./backend/otel/otel-config.yaml:/etc/otelcol-contrib/config.yaml
    depends_on:
      - kairos-grafana

  # ---------------------------------------------------------------------------
  # Observability — Grafana
  # UI: http://localhost:3001
  # Default credentials: admin / kairos_dev_password
  # ---------------------------------------------------------------------------
  kairos-grafana:
    image: grafana/grafana:11.0.0
    container_name: kairos-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-kairos_dev_password}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - kairos-grafana_data:/var/lib/grafana
      - ./backend/grafana/provisioning:/etc/grafana/provisioning
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  # Layer 9: API — FastAPI (Hot-reload)
  # Port: 8000
  # ---------------------------------------------------------------------------
  kairos-backend-api:
    build:
      context: ./backend
    container_name: kairos-backend-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - NEO4J_URI=bolt://kairos-neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-kairos_dev_password}
      - QDRANT_URL=http://kairos-qdrant:6333
      - ELASTICSEARCH_URL=http://kairos-elasticsearch:9200
      - REDIS_URL=redis://kairos-redis:6379/0
    env_file:
      - .env
    depends_on:
      - kairos-neo4j
      - kairos-qdrant
      - kairos-elasticsearch
      - kairos-redis
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # ---------------------------------------------------------------------------
  # Layer 7: Task Execution — Celery Workers (Hot-reload)
  # ---------------------------------------------------------------------------
  kairos-temporal-worker:
    build:
      context: ./backend
    container_name: kairos-temporal-worker
    restart: unless-stopped
    volumes:
      - ./backend:/app
    environment:
      - NEO4J_URI=bolt://kairos-neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-kairos_dev_password}
      - QDRANT_URL=http://kairos-qdrant:6333
      - ELASTICSEARCH_URL=http://kairos-elasticsearch:9200
      - REDIS_URL=redis://kairos-redis:6379/0
    env_file:
      - .env
    depends_on:
      - kairos-redis
    command: ["celery", "-A", "workers.celery_app", "worker", "--loglevel=info", "--queues=ingestion,extraction,attribution"]

  # ---------------------------------------------------------------------------
  # Layer 5: OT Connectors — Go (Hot-reload via builder stage)
  # Port: 8090
  # ---------------------------------------------------------------------------
  kairos-backend-go:
    build:
      context: ./backend/connectors
      target: builder
    container_name: kairos-backend-go
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./backend/connectors:/app
    env_file:
      - .env
    command: ["go", "run", "./cmd/connector/..."]
# =============================================================================
# Named Volumes
# =============================================================================
volumes:
  kairos-neo4j_data:
  kairos-neo4j_logs:
  kairos-neo4j_plugins:
  kairos-qdrant_data:
  kairos-elasticsearch_data:
  kairos-redis_data:
  kairos-temporal_postgres_data:
  kairos-grafana_data:


