name: kairos

# =============================================================================
# KAIROS — Local Development Stack
# Start: docker compose up -d
# Stop:  docker compose down
# Nuke:  docker compose down -v  (destroys all volumes)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Layer 4: Temporal Reality Graph — Neo4j (local)
  # Browser UI: http://localhost:7474
  # Bolt:       bolt://localhost:7687
  # ---------------------------------------------------------------------------
  kairos-neo4j:
    image: neo4j:5.20-community
    container_name: kairos-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-kairos_dev_password}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "1G"
  # ---------------------------------------------------------------------------
  # Layer 12: Frontend — Next.js (dev server, hot-reload)
  # UI: http://localhost:3000
  # Built from frontend/Dockerfile — deps installed at image build time.
  # Only src/ and public/ are mounted for hot-reload; node_modules stays in image.
  # ---------------------------------------------------------------------------
  kairos-frontend:
    build:
      context: ./frontend
    container_name: kairos-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - API_INTERNAL_URL=http://kairos-backend-api:8000
      - NODE_ENV=development
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ---------------------------------------------------------------------------
  # Layer 11: Vector Search — Qdrant
  # REST:  http://localhost:6333
  # gRPC:  localhost:6334
  # UI:    http://localhost:6333/dashboard
  # ---------------------------------------------------------------------------
  kairos-qdrant:
    image: qdrant/qdrant:v1.9.4
    container_name: kairos-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - kairos-qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 20s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Layer 11: Exact Search — Elasticsearch
  # REST: http://localhost:9200
  # ---------------------------------------------------------------------------
  kairos-elasticsearch:
    image: elasticsearch:8.13.4
    container_name: kairos-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx1g"
    volumes:
      - kairos-elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Cache + Event Bus — Redis (Streams + Cache)
  # Port: 6379
  # ---------------------------------------------------------------------------
  kairos-redis:
    image: redis:7.2-alpine
    container_name: kairos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - kairos-redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Durable Workflow Engine — Temporal.io
  # Backend DB (Temporal internal): postgresql
  # Temporal gRPC: localhost:7233
  # Temporal Web UI: http://localhost:8088
  # ---------------------------------------------------------------------------
  kairos-temporal-postgres:
    image: postgres:14-alpine
    container_name: kairos-temporal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - kairos-temporal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5

  kairos-temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: kairos-temporal
    restart: unless-stopped
    ports:
      - "7233:7233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: kairos-temporal-postgres
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig.yaml
    depends_on:
      kairos-temporal-postgres:
        condition: service_healthy
    volumes:
      - ./infra/temporal/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig.yaml
    healthcheck:
      test: ["CMD", "temporal", "workflow", "list", "--address", "kairos-temporal:7233", "--namespace", "default"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  kairos-temporal-ui:
    image: temporalio/ui:2.26.2
    container_name: kairos-temporal_ui
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      TEMPORAL_ADDRESS: kairos-temporal:7233
      TEMPORAL_CORS_ORIGINS: "http://localhost:3000"
    depends_on:
      - kairos-temporal

  # ---------------------------------------------------------------------------
  # Governance — Open Policy Agent (OPA)
  # REST: http://kairos-opa:8181
  # ---------------------------------------------------------------------------
  kairos-opa:
    image: openpolicyagent/opa:0.65.0
    container_name: kairos-opa
    restart: unless-stopped
    ports:
      - "8181:8181"
    command:
      - "run"
      - "--server"
      - "--log-format=json"
      - "--log-level=info"
      - "/policies"
    volumes:
      - ./infra/policies:/policies
    healthcheck:
      disable: true

  # ---------------------------------------------------------------------------
  # Secrets + Signing — HashiCorp Vault (dev mode)
  # UI: http://localhost:8200
  # Root Token: kairos-dev-root-token (dev mode only)
  # ---------------------------------------------------------------------------
  kairos-vault:
    image: hashicorp/vault:1.17
    container_name: kairos-vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "${VAULT_DEV_ROOT_TOKEN:-kairos-dev-root-token}"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Observability — OpenTelemetry Collector
  # OTLP gRPC: 4317
  # OTLP HTTP: 4318
  # ---------------------------------------------------------------------------
  kairos-otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.0
    container_name: kairos-otel-collector
    restart: unless-stopped
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus metrics exporter
    volumes:
      - ./infra/otel/otel-config.yaml:/etc/otelcol-contrib/config.yaml
    depends_on:
      - kairos-tempo

  # ---------------------------------------------------------------------------
  # Observability — Grafana Tempo (distributed tracing backend)
  # OTLP gRPC: 4317 (internal)
  # HTTP API: http://localhost:3200
  # ---------------------------------------------------------------------------
  kairos-tempo:
    image: grafana/tempo:2.4.1
    container_name: kairos-tempo
    restart: unless-stopped
    ports:
      - "3200:3200"   # Tempo HTTP API
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml
      - kairos-tempo_data:/var/tempo
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://localhost:3200/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Observability — Grafana
  # UI: http://localhost:3001
  # Default credentials: admin / kairos_dev_password
  # ---------------------------------------------------------------------------
  kairos-grafana:
    image: grafana/grafana:11.0.0
    container_name: kairos-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-kairos_dev_password}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - kairos-grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - kairos-tempo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  # Layer 9: API — FastAPI (Hot-reload)
  # Port: 8000
  # ---------------------------------------------------------------------------
  kairos-backend-api:
    build:
      context: ./backend
    container_name: kairos-backend-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./tests:/app/tests
      - ./pytest.ini:/app/pytest.ini
      - ./fixtures:/app/fixtures
      - ./db:/app/db
    environment:
      - NEO4J_URI=bolt://kairos-neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-kairos_dev_password}
      - QDRANT_URL=http://kairos-qdrant:6333
      - ELASTICSEARCH_URL=http://kairos-elasticsearch:9200
      - REDIS_URL=redis://kairos-redis:6379/0
      - TEMPORAL_ADDRESS=kairos-temporal:7233
      - CELERY_BROKER_URL=redis://kairos-redis:6379/1
      - CELERY_RESULT_BACKEND=redis://kairos-redis:6379/1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://kairos-otel-collector:4317
      - OT_CONNECTOR_URL=http://kairos-backend-go:8090
      - PYTHONPATH=/app
    env_file:
      - .env
    depends_on:
      - kairos-neo4j
      - kairos-qdrant
      - kairos-elasticsearch
      - kairos-redis
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # ---------------------------------------------------------------------------
  # Layer 7: Task Execution — Celery Workers (Hot-reload)
  # ---------------------------------------------------------------------------
  kairos-celery-worker:
    build:
      context: ./backend
    container_name: kairos-celery-worker
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - ./fixtures:/app/fixtures
      - ./db:/app/db
    environment:
      - NEO4J_URI=bolt://kairos-neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-kairos_dev_password}
      - QDRANT_URL=http://kairos-qdrant:6333
      - ELASTICSEARCH_URL=http://kairos-elasticsearch:9200
      - REDIS_URL=redis://kairos-redis:6379/0
      - TEMPORAL_ADDRESS=kairos-temporal:7233
      - CELERY_BROKER_URL=redis://kairos-redis:6379/1
      - CELERY_RESULT_BACKEND=redis://kairos-redis:6379/1
      - GO_CONNECTOR_URL=http://kairos-backend-go:8090
    env_file:
      - .env
    depends_on:
      - kairos-redis
    command: ["celery", "-A", "workers.celery_app", "worker", "--loglevel=info", "--queues=ingestion,extraction,attribution,transcription,validation,elicitation"]

  # ---------------------------------------------------------------------------
  # Layer 3: Temporal Activity Worker — DocumentIngestionWorkflow activities
  # Runs store_in_vault, run_ocr, run_ner, link_to_graph, index_vectors, index_text
  # ---------------------------------------------------------------------------
  kairos-temporal-activity-worker:
    build:
      context: ./backend
    container_name: kairos-temporal-activity-worker
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - ./fixtures:/app/fixtures
      - ./db:/app/db
    environment:
      - NEO4J_URI=bolt://kairos-neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-kairos_dev_password}
      - QDRANT_URL=http://kairos-qdrant:6333
      - ELASTICSEARCH_URL=http://kairos-elasticsearch:9200
      - REDIS_URL=redis://kairos-redis:6379/0
      - TEMPORAL_ADDRESS=kairos-temporal:7233
      - TEMPORAL_TASK_QUEUE=kairos-ingestion
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    env_file:
      - .env
    depends_on:
      kairos-temporal:
        condition: service_started
      kairos-redis:
        condition: service_healthy
    command: ["python", "-m", "workers.temporal_worker"]

  # ---------------------------------------------------------------------------
  # Layer 6: Elicitation Engine — Temporal worker for MicroInterviewWorkflow
  # Polls kairos-elicitation task queue; generates graph-derived questions
  # ---------------------------------------------------------------------------
  kairos-elicitation-worker:
    build:
      context: ./backend
    container_name: kairos-elicitation-worker
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - ./fixtures:/app/fixtures
      - ./db:/app/db
    environment:
      - NEO4J_URI=bolt://kairos-neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-kairos_dev_password}
      - TEMPORAL_ADDRESS=kairos-temporal:7233
      - TEMPORAL_TASK_QUEUE=kairos-elicitation
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    env_file:
      - .env
    depends_on:
      kairos-temporal:
        condition: service_started
      kairos-redis:
        condition: service_healthy
    command: ["python", "-m", "workers.elicitation_worker"]

  # ---------------------------------------------------------------------------
  # Layer 5: OT Connectors — Go (Hot-reload via builder stage)
  # Port: 8090
  # ---------------------------------------------------------------------------
  kairos-backend-go:
    build:
      context: ./backend/connectors
      target: builder
    container_name: kairos-backend-go
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./backend/connectors:/app
    environment:
      - FASTAPI_URL=http://kairos-backend-api:8000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-kairos-internal-dev-key}
      - EAM_FIXTURE_PATH=/app/fixtures/sample_assets.json
    env_file:
      - .env
    depends_on:
      - kairos-backend-api
    command: ["go", "run", "./cmd/connector/..."]
# =============================================================================
# Named Volumes
# =============================================================================
volumes:
  kairos-neo4j_data:
  kairos-neo4j_logs:
  kairos-tempo_data:
  kairos-neo4j_plugins:
  kairos-qdrant_data:
  kairos-elasticsearch_data:
  kairos-redis_data:
  kairos-temporal_postgres_data:
  kairos-grafana_data:


