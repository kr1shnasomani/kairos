name: kairos

# =============================================================================
# KAIROS — BASE stack (production / AWS-safe defaults)
#
#   Local dev :  docker compose up -d --build
#                (auto-merges docker-compose.override.yml → hot-reload, debug
#                 ports, dev UIs. `make dev` does exactly this.)
#
#   AWS / prod:  docker compose -f docker-compose.yml up -d --build
#                (base only — no bind-mounts, no debug ports, non-root images,
#                 network isolation, resource limits.)
#
# Cloud services (NOT containers): Supabase Postgres + Storage + Auth + Vault.
# Only the two edge ports (frontend 3000, API 8000) are published here; every
# datastore stays internal. Dev exposes the rest via the override file.
# =============================================================================

# --- reusable fragments ----------------------------------------------------
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-svc: &svc
  restart: unless-stopped
  <<: *logging

x-backend-build: &backend-build
  build:
    context: ./backend
  image: kairos-backend:local   # built once, reused by API + all 3 workers

x-backend-env: &backend-env
  NEO4J_URI: bolt://kairos-neo4j:7687
  NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-kairos_dev_password}
  QDRANT_URL: http://kairos-qdrant:6333
  ELASTICSEARCH_URL: http://kairos-elasticsearch:9200
  REDIS_URL: redis://kairos-redis:6379/0
  TEMPORAL_ADDRESS: kairos-temporal:7233
  CELERY_BROKER_URL: redis://kairos-redis:6379/1
  CELERY_RESULT_BACKEND: redis://kairos-redis:6379/1

services:

  # ===========================================================================
  # Layer 12: Frontend — Next.js (standalone production server)
  # ===========================================================================
  kairos-frontend:
    <<: *svc
    build:
      context: ./frontend
      target: runner
    image: kairos-frontend:local
    container_name: kairos-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      API_INTERNAL_URL: http://kairos-backend-api:8000
      NODE_ENV: production
    depends_on:
      kairos-backend-api:
        condition: service_started
    networks: [edge]
    deploy:
      resources:
        limits:
          memory: 1g

  # ===========================================================================
  # Layer 9: API — FastAPI
  # ===========================================================================
  kairos-backend-api:
    <<: [*svc, *backend-build]
    container_name: kairos-backend-api
    ports:
      - "8000:8000"
    environment:
      <<: *backend-env
      PYTHONPATH: /app
      OTEL_EXPORTER_OTLP_ENDPOINT: http://kairos-otel-collector:4317
      OT_CONNECTOR_URL: http://kairos-backend-go:8090
    env_file: [.env]
    volumes:
      - ./fixtures:/app/fixtures
      - ./db:/app/db
      - ./dataset:/app/dataset:ro
    depends_on:
      kairos-neo4j:
        condition: service_healthy
      kairos-qdrant:
        condition: service_healthy
      kairos-elasticsearch:
        condition: service_healthy
      kairos-redis:
        condition: service_healthy
      kairos-opa:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks: [edge, internal]
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    deploy:
      resources:
        limits:
          memory: 1500m

  # ===========================================================================
  # Layer 7: Celery Workers (ingestion, extraction, attribution, transcription,
  #          validation, elicitation)
  # ===========================================================================
  kairos-celery-worker:
    <<: [*svc, *backend-build]
    container_name: kairos-celery-worker
    environment:
      <<: *backend-env
      GO_CONNECTOR_URL: http://kairos-backend-go:8090
    env_file: [.env]
    volumes:
      - ./fixtures:/app/fixtures
      - ./db:/app/db
    depends_on:
      kairos-redis:
        condition: service_healthy
      kairos-neo4j:
        condition: service_healthy
      kairos-qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "workers.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks: [internal]
    command: ["celery", "-A", "workers.celery_app", "worker", "--loglevel=info", "--queues=ingestion,extraction,attribution,transcription,validation,elicitation"]
    deploy:
      resources:
        limits:
          memory: 1500m

  # ===========================================================================
  # Layer 3: Temporal Activity Worker (document ingestion pipeline)
  # ===========================================================================
  kairos-temporal-activity-worker:
    <<: [*svc, *backend-build]
    container_name: kairos-temporal-activity-worker
    environment:
      <<: *backend-env
      TEMPORAL_TASK_QUEUE: kairos-ingestion
      # Cloud-only: empty disables the local Ollama fallback (RAM guard).
      OLLAMA_BASE_URL: ""
    env_file: [.env]
    volumes:
      - ./fixtures:/app/fixtures
      - ./db:/app/db
    depends_on:
      kairos-temporal:
        condition: service_healthy
      kairos-redis:
        condition: service_healthy
      kairos-neo4j:
        condition: service_healthy
    networks: [internal]
    command: ["python", "-m", "workers.temporal_worker"]
    deploy:
      resources:
        limits:
          memory: 1500m

  # ===========================================================================
  # Layer 6: Elicitation Worker (MicroInterviewWorkflow)
  # ===========================================================================
  kairos-elicitation-worker:
    <<: [*svc, *backend-build]
    container_name: kairos-elicitation-worker
    environment:
      <<: *backend-env
      TEMPORAL_TASK_QUEUE: kairos-elicitation
      OLLAMA_BASE_URL: ""
    env_file: [.env]
    volumes:
      - ./fixtures:/app/fixtures
      - ./db:/app/db
    depends_on:
      kairos-temporal:
        condition: service_healthy
      kairos-redis:
        condition: service_healthy
      kairos-neo4j:
        condition: service_healthy
    networks: [internal]
    command: ["python", "-m", "workers.elicitation_worker"]
    deploy:
      resources:
        limits:
          memory: 1g

  # ===========================================================================
  # Layer 5: Go OT Connector (historian + EAM sync)
  # ===========================================================================
  kairos-backend-go:
    <<: *svc
    build:
      context: ./backend/connectors
      target: release
    image: kairos-connector:local
    container_name: kairos-backend-go
    environment:
      FASTAPI_URL: http://kairos-backend-api:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-kairos-internal-dev-key}
      EAM_FIXTURE_PATH: /app/fixtures/sample_assets.json
    env_file: [.env]
    depends_on:
      kairos-backend-api:
        condition: service_started
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 256m

  # ===========================================================================
  # Layer 4: Neo4j — Temporal knowledge graph
  # ===========================================================================
  kairos-neo4j:
    <<: *svc
    image: neo4j:5.20-community
    container_name: kairos-neo4j
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-kairos_dev_password}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "1G"
    volumes:
      - kairos-neo4j_data:/data
      - kairos-neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USERNAME:-neo4j} -p ${NEO4J_PASSWORD:-kairos_dev_password} 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 2g

  # ===========================================================================
  # Layer 11: Qdrant — vector store
  # ===========================================================================
  kairos-qdrant:
    <<: *svc
    image: qdrant/qdrant:v1.9.4
    container_name: kairos-qdrant
    volumes:
      - kairos-qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 1g

  # ===========================================================================
  # Layer 11: Elasticsearch — full-text search
  # ===========================================================================
  kairos-elasticsearch:
    <<: *svc
    image: elasticsearch:8.13.4
    container_name: kairos-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx1g"
    volumes:
      - kairos-elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 2g

  # ===========================================================================
  # Cache + event bus — Redis (Streams + Celery broker)
  # ===========================================================================
  kairos-redis:
    <<: *svc
    image: redis:7.2-alpine
    container_name: kairos-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - kairos-redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 768m

  # ===========================================================================
  # Temporal — durable workflow engine (+ its own Postgres)
  # ===========================================================================
  kairos-temporal-postgres:
    <<: *svc
    image: postgres:14-alpine
    container_name: kairos-temporal_postgres
    environment:
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-temporal}
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal}
      POSTGRES_DB: temporal
    volumes:
      - kairos-temporal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEMPORAL_POSTGRES_USER:-temporal}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 512m

  kairos-temporal:
    <<: *svc
    image: temporalio/auto-setup:1.24.2
    container_name: kairos-temporal
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-temporal}
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal}
      POSTGRES_SEEDS: kairos-temporal-postgres
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig.yaml
    depends_on:
      kairos-temporal-postgres:
        condition: service_healthy
    volumes:
      - ./infra/temporal/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig.yaml:ro
    healthcheck:
      test: ["CMD", "temporal", "workflow", "list", "--address", "kairos-temporal:7233", "--namespace", "default"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 512m

  kairos-temporal-ui:
    <<: *svc
    image: temporalio/ui:2.26.2
    container_name: kairos-temporal_ui
    environment:
      TEMPORAL_ADDRESS: kairos-temporal:7233
      TEMPORAL_CORS_ORIGINS: "http://localhost:3000"
    depends_on:
      - kairos-temporal
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 256m

  # ===========================================================================
  # Governance — Open Policy Agent (OPA)
  # ===========================================================================
  kairos-opa:
    <<: *svc
    image: openpolicyagent/opa:0.65.0
    container_name: kairos-opa
    command:
      - "run"
      - "--server"
      - "--log-format=json"
      - "--log-level=info"
      - "/policies"
    volumes:
      - ./infra/policies:/policies:ro
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 256m

  # ===========================================================================
  # Observability — OTEL Collector → Tempo (traces) + Prometheus endpoint
  # ===========================================================================
  kairos-otel-collector:
    <<: *svc
    image: otel/opentelemetry-collector-contrib:0.102.0
    container_name: kairos-otel-collector
    volumes:
      - ./infra/otel/otel-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - kairos-tempo
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 512m

  kairos-tempo:
    <<: *svc
    image: grafana/tempo:2.4.1
    container_name: kairos-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - kairos-tempo_data:/var/tempo
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3200/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 512m

  kairos-grafana:
    <<: *svc
    image: grafana/grafana:11.0.0
    container_name: kairos-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-kairos_dev_password}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - kairos-grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - kairos-tempo
      - kairos-otel-collector
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 512m

# =============================================================================
# Networks — edge (public-facing) vs internal (datastores, never published)
# =============================================================================
networks:
  edge:
    driver: bridge
  internal:
    driver: bridge

# =============================================================================
# Named volumes (persistent state)
# =============================================================================
volumes:
  kairos-neo4j_data:
  kairos-neo4j_logs:
  kairos-qdrant_data:
  kairos-elasticsearch_data:
  kairos-redis_data:
  kairos-temporal_postgres_data:
  kairos-tempo_data:
  kairos-grafana_data:
